# ============================================================
# 巡检配置文件（health_check.sh 自动读取）
# 修改后无需改脚本代码，重新执行巡检即可生效
# ============================================================

# ---------- 资源告警阈值（单位：%） ----------
CPU_THRESHOLD=85
MEM_THRESHOLD=85
DISK_THRESHOLD=85

# ---------- 核心服务（systemd 单元名，空格分隔的数组） ----------
SERVICES=(ssh cron rsyslog)

# ---------- 网络巡检目标 ----------
# ping 连通性检测（建议配置两个不同运营商的公网 DNS）
PING_TARGETS=(223.5.5.5 119.29.29.29)
# DNS 解析检测域名
DNS_TARGET="www.baidu.com"
# 业务 HTTP 探活地址（与项目一监控栈的 Nginx 演示站点联动）
# 本机 8080 被其他服务占用，项目一 Nginx 映射到了 8081；Linux 服务器上通常写 8080
HTTP_TARGETS=("http://localhost:8081")
# HTTP 探活超时（秒）
HTTP_TIMEOUT=5

# ---------- 安全检查 ----------
# journalctl 模式下失败登录日志的回溯时间窗口
FAILED_LOGIN_SINCE="7 days ago"
